[package]
name = "sotarena"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
description = "Minimal JSON-backed SOTArena fetcher and Elo reporter"

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
ureq = "2.10"
zeroize = "1.8"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
